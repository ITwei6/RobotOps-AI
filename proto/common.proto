syntax = "proto3";

package robotops.common;

option cc_generic_services = true;

message CommonResponse {
  int32 code = 1;
  string message = 2;
  string trace_id = 3;
}

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

message TimeRange {
  int64 start_time = 1;
  int64 end_time = 2;
}

enum RobotType {
  ROBOT_TYPE_UNSPECIFIED = 0;
  ROBOT_TYPE_T = 1;
  ROBOT_TYPE_Q = 2;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED = 4;
}

